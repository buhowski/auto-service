sectionTitle:
  eyebrow: 'Просто від початку до кінця'
  headline: 'Три кроки до справного авто'
items:
  - icon: 'step1'
    title: 'Запишіться на візит'
    description: 'Оберіть час online або зателефонуйте. Для планового обслуговування часто є місця на сьогодні.'
  - icon: 'step2'
    title: 'Діагностика і кошторис'
    description: 'Майстер огляне авто, пояснить причину несправності та погодить письмовий кошторис до початку робіт.'
  - icon: 'step3'
    title: 'Ремонт з гарантією'
    description: 'Сертифіковані майстри виконають ремонт, перевірять авто на дорозі й передадуть його з гарантією 24 місяці.'
