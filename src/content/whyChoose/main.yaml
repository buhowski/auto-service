sectionTitle:
  eyebrow: "Чому обирають СТО Поршень"
  headline: "Гараж, де поважають клієнта, а не рахунок"
lead: "Ми побудували СТО Поршень на простій обіцянці: ремонтуємо якісно з першого разу, ставимо чесну ціну і пояснюємо все простою мовою. Тому родини у Львові довіряють нам вже понад 10 років."
items:
  - icon: "certified"
    title: "Сертифіковані майстри"
    description: "Кожен ремонт виконує кваліфікований технік, не стажер. Ми інвестуємо в постійне навчання, щоб сервісувати сучасні гібриди та турбомотори."
  - icon: "quote"
    title: "Прозорі кошториси"
    description: "Ви затверджуєте ціну до того, як ми візьмемо ключі. Ніяких прихованих платежів, непотрібних запчастин або навязування послуг."
  - icon: "warranty"
    title: "Гарантія 24 місяці на ремонт"
    description: "Запчастини та робочі години покриті гарантією по всій Україні на 2 роки або 40 000 км — бо ми стоїмо за своєю роботою."
  - icon: "speed"
    title: "Швидкий термін виконання"
    description: "Більшість ТО виконуємо за один день. Потрібен трансфер? Безкоштовний шатл у межах міста та заміна авто на час капітального ремонту."
image:
  src: "/why-shop.jpg"
  alt: "Інтер'єр чистого, сучасного СТО з авто на підйомах та організованими інструментами"
