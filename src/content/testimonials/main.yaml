sectionTitle:
  eyebrow: "Прямо з парковки"
  headline: "Що кажуть наші клієнти"
items:
  - rating: 5
    quote: "Дилер просив $1200 за 'роботу з двигуном'. СТО Поршень знайшли несправну котушку, виправили за частину ціни та показали стару деталь. Ніколи більше не піду в інше місце."
    author:
      name: "Олександр К."
      role: "Власник Ford F-150"
      image: "/cust-1.jpg"
      imageAlt: "Фото клієнта Олександра К."
  - rating: 5
    quote: "Гальма зробили, і я був на дорозі до обіду. Чесна ціна, чиста зона очікування, а майстер реально пояснив, що зносилося. Рекомендую."
    author:
      name: "Софія Р."
      role: "Власник Honda CR-V"
      image: "/cust-2.jpg"
      imageAlt: "Фото клієнта Софії Р."
  - rating: 5
    quote: "Веземо всі родинні авто сюди вже 12 років. Чесні майстри, ніколи не нав'язують непотрібне. Гарантія дає реальний спокій."
    author:
      name: "Ахмед К."
      role: "Власник Toyota Camry"
      image: "/cust-3.jpg"
      imageAlt: "Фото клієнта Ахмеда К."
  - rating: 5
    quote: "Привіз Jeep на діагностику перед далекою поїздкою. Пояснили проблему, узгодили ціну та повернули авто вчасно. Поїздка минула без пригод."
    author:
      name: "Денис М."
      role: "Власник Jeep Grand Cherokee"
      image: "/cust-1.jpg"
      imageAlt: "Фото клієнта Дениса М."
