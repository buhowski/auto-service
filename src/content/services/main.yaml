sectionTitle:
  eyebrow: "Що ми ремонтуємо"
  headline: "Повний цикл авторемонту під одним дахом"
items:
  - icon: "engine"
    title: "Двигун та трансмісія"
    description: "Діагностика, ремонт ДВЗ, АКПП, МКПП, заміна ременів і ланцюгів ГРМ, турбін."
  - icon: "brakes"
    title: "Гальмівна система"
    description: "Заміна колодок, дисків, шлангів, гальмівної рідини, ремонт АБС/ESP, прокачування систем."
  - icon: "suspension"
    title: "Підвіска та кермування"
    description: "Амортизатори, стійки стабілізатора, рульові наконечники, кульові опори та регулювання розвалу-сходження."
  - icon: "electric"
    title: "Електрика та діагностика"
    description: "Сканування блоків керування, ремонт проводки, заміна генераторів, стартерів, датчиків."
  - icon: "ac"
    title: "Клімат-контроль"
    description: "Заправка кондиціонерів, пошук витоків, ремонт компресорів, заміна фільтрів кабінки."
  - icon: "maintenance"
    title: "ТО та заміна техплин"
    description: "Планове ТО за графіком, заміна оливи, фільтрів, свічок і охолоджувальної рідини."
