# Pages CMS configuration
# https://pagescms.org/docs/configuration

media:
  input: public/assets
  output: /assets

content:
  - name: services
    label: Послуги
    type: collection
    path: src/content/services
    format: yaml-frontmatter
    filename: '{title}.md'
    fields:
      - name: title
        label: Назва послуги
        type: string
        required: true
      - name: description
        label: Опис
        type: rich-text
      - name: price
        label: Ціна
        type: string
      - name: image
        label: Зображення
        type: image

  - name: reviews
    label: Відгуки
    type: collection
    path: src/content/reviews
    format: yaml-frontmatter
    filename: '{client}.md'
    fields:
      - name: client
        label: Клієнт
        type: string
        required: true
      - name: text
        label: Текст відгуку
        type: rich-text
      - name: rating
        label: Рейтинг
        type: number
