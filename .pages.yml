components:
  backgroundMedia:
    type: object
    fields:
      - name: type
        label: Background type
        type: select
        required: true
        options:
          values:
            - name: none
              label: No media
            - name: image
              label: Image
            - name: video
              label: Video
      - name: image
        label: Background image or video poster
        type: image
        options:
          media: uploads
          path: public/uploads
          categories: [image]
      - name: video
        label: Background video
        type: file
        options:
          media: uploads
          path: public/uploads
          categories: [video]
          extensions: [mp4, webm]
      - name: alt
        label: Image description
        type: string

media:
  - name: uploads
    label: Images and SVG files
    input: public/uploads
    output: /uploads
    categories: [image, video]

content:
  - name: site
    label: Site settings
    type: file
    path: src/content/site.json
    fields:
      - name: brandPrefix
        label: Brand prefix
        type: string
      - name: brandName
        label: Brand name
        type: string
      - name: city
        label: City
        type: string
      - name: cityLocative
        label: City name in locative case, used in copy such as "in {cityLocative}"
        type: string
      - name: phoneNumber
        label: Phone number in international format
        type: string
      - name: phoneCountryCode
        label: Phone country code displayed in the booking form
        type: string
      - name: address
        label: Street address
        type: string
      - name: mapEmbedUrl
        label: Google Maps embed URL
        type: string
      - name: footerAbout
        label: Footer description
        type: text
      - name: ui
        label: Interface text and accessibility labels
        type: object
        fields:
          - name: brandHomeLabel
            label: Home link label. Supports {name}.
            type: string
          - name: bookingCloseLabel
            label: Close booking form button
            type: string
          - name: nameLabel
            label: Name field label
            type: string
          - name: phoneLabel
            label: Phone field label
            type: string
          - name: noteLabel
            label: Request field label
            type: string
          - name: contactMethodLegend
            label: Contact method legend
            type: string
          - name: contactMethods
            label: Contact method choices
            type: string
            list: true
          - name: alternativeContact
            label: Alternative contact heading
            type: string
          - name: headerNavLabel
            label: Main navigation accessibility label
            type: string
          - name: mobileNavLabel
            label: Mobile navigation accessibility label
            type: string
          - name: openMenuLabel
            label: Open menu button
            type: string
          - name: closeMenuLabel
            label: Close menu button
            type: string
          - name: bookingButtonLabel
            label: Booking button
            type: string
          - name: phoneAccessibleLabel
            label: Phone link accessibility label. Supports {phone}.
            type: string
          - name: phoneTitle
            label: Phone link title
            type: string
          - name: socialNavLabel
            label: Social navigation accessibility label
            type: string
          - name: contactSocialNavLabel
            label: Contact and social navigation accessibility label
            type: string
          - name: footerContactLabel
            label: Footer contacts accessibility label
            type: string
          - name: copyright
            label: Copyright text
            type: string
          - name: loaderLabel
            label: Page loading accessibility label
            type: string
      - name: navigation
        label: Navigation links
        type: object
        list: true
        fields:
          - name: href
            label: Section link
            type: string
          - name: label
            label: Link text
            type: string
      - name: socialLinks
        label: Social links
        type: object
        list: true
        fields:
          - name: title
            label: Network
            type: string
          - name: label
            label: Accessible label
            type: string
          - name: href
            label: URL
            type: string
          - name: icon
            label: Icon name
            type: string
          - name: external
            label: Opens in a new tab
            type: boolean
      - name: booking
        label: Booking form labels
        type: object
        fields:
          - name: title
            label: Title
            type: string
          - name: intro
            label: Intro
            type: text
          - name: optionalLabel
            label: Optional field marker
            type: string
          - name: submitLabel
            label: Submit button
            type: string
          - name: namePlaceholder
            label: Name placeholder
            type: string
          - name: phonePlaceholder
            label: Phone placeholder
            type: string
          - name: notePlaceholder
            label: Note placeholder
            type: string
          - name: status
            label: Status message
            type: text
  - name: seo
    label: SEO and social preview
    type: file
    path: src/content/seo.json
    fields:
      - name: language
        label: HTML language code
        type: string
      - name: title
        label: Page title template. Supports {name} and {city}.
        type: string
      - name: description
        label: Search description template. Supports {name}, {city}, {cityLocative}, and {phone}.
        type: text
      - name: canonicalUrl
        label: Canonical URL override. Leave empty to use the current page URL.
        type: string
      - name: robots
        label: Robots policy
        type: string
      - name: themeColor
        label: Browser theme color
        type: string
      - name: favicon
        label: Favicon path
        type: string
      - name: appleTouchIcon
        label: Apple touch icon path
        type: string
      - name: openGraph
        label: Open Graph
        type: object
        fields:
          - name: locale
            label: Locale
            type: string
          - name: type
            label: Content type
            type: string
          - name: siteName
            label: Site name template. Supports {name}.
            type: string
          - name: title
            label: Social title. Leave empty to use page title.
            type: string
          - name: description
            label: Social description. Leave empty to use search description.
            type: text
          - name: image
            label: Share image
            type: image
            options:
              media: uploads
              path: public/uploads
              categories: [image]
          - name: imageAlt
            label: Share image description
            type: string
      - name: twitter
        label: X/Twitter card
        type: object
        fields:
          - name: card
            label: Card type
            type: string
          - name: title
            label: Card title. Leave empty to use Open Graph title.
            type: string
          - name: description
            label: Card description. Leave empty to use Open Graph description.
            type: text
          - name: image
            label: Card image. Leave empty to use Open Graph image.
            type: image
            options:
              media: uploads
              path: public/uploads
              categories: [image]
  - name: homepage
    label: Homepage content
    type: file
    path: src/content/homepage.json
    fields:
      - name: hero
        label: Hero
        type: object
        fields:
          - name: headline
            label: Headline
            type: string
          - name: highlightedWord
            label: Highlighted word
            type: string
          - name: subtext
            label: Description
            type: text
          - name: background
            label: Background media
            component: backgroundMedia
          - name: primaryCta
            label: Primary button
            type: string
          - name: secondaryCta
            label: Secondary button
            type: string
      - name: whyChoose
        label: Why choose us
        type: object
        fields:
          - name: eyebrow
            label: Eyebrow
            type: string
          - name: headline
            label: Headline
            type: string
          - name: lead
            label: Intro
            type: text
          - name: image
            label: Image
            type: image
          - name: imageAlt
            label: Image description
            type: string
          - name: items
            label: Benefits
            type: object
            list: true
            fields:
              - name: icon
                label: Icon name
                type: string
              - name: title
                label: Title
                type: string
              - name: description
                label: Description
                type: text
      - name: steps
        label: Process steps
        type: object
        fields:
          - name: eyebrow
            label: Eyebrow
            type: string
          - name: title
            label: Headline
            type: string
          - name: items
            label: Steps
            type: object
            list: true
            fields:
              - name: icon
                label: SVG icon name
                type: string
              - name: title
                label: Title
                type: string
              - name: description
                label: Description
                type: text
      - name: testimonials
        label: Testimonials
        type: object
        fields:
          - name: eyebrow
            label: Eyebrow
            type: string
          - name: headline
            label: Headline
            type: string
          - name: ui
            label: Carousel accessibility labels. Supports {number} and {rating}.
            type: object
            fields:
              - name: slideLabel
                label: Slide label
                type: string
              - name: ratingLabel
                label: Rating label
                type: string
              - name: navigationLabel
                label: Navigation label
                type: string
              - name: previousLabel
                label: Previous button
                type: string
              - name: nextLabel
                label: Next button
                type: string
          - name: items
            label: Reviews
            type: object
            list: true
            fields:
              - name: rating
                label: Rating
                type: number
              - name: quote
                label: Review
                type: text
              - name: author
                label: Author
                type: object
                fields:
                  - name: name
                    label: Name
                    type: string
                  - name: role
                    label: Vehicle
                    type: string
                  - name: image
                    label: Photo
                    type: image
                  - name: imageAlt
                    label: Photo description
                    type: string
      - name: brands
        label: Car brands
        type: object
        fields:
          - name: eyebrow
            label: Eyebrow
            type: string
          - name: headline
            label: Headline
            type: string
          - name: description
            label: Description
            type: text
          - name: carouselLabel
            label: Brand list accessibility label
            type: string
          - name: items
            label: Brands
            type: object
            list: true
            fields:
              - name: name
                label: Brand name
                type: string
              - name: logo
                label: SVG logo
                type: image
      - name: cta
        label: Call to action
        type: object
        fields:
          - name: eyebrow
            label: Eyebrow
            type: string
          - name: headline
            label: Headline
            type: string
          - name: subtext
            label: Description
            type: text
          - name: background
            label: Background media
            component: backgroundMedia
          - name: primaryCta
            label: Primary button
            type: string
          - name: secondaryCta
            label: Secondary button
            type: string
      - name: hours
        label: Contact section
        type: object
        fields:
          - name: eyebrow
            label: Eyebrow
            type: string
          - name: headline
            label: Headline
            type: string
          - name: lead
            label: Description. Use {address} for the address.
            type: text
          - name: directionsLabel
            label: Directions button
            type: string
          - name: scheduleTitle
            label: Schedule heading
            type: string
          - name: scheduleAriaLabel
            label: Schedule accessibility label
            type: string
          - name: addressLabel
            label: Address heading
            type: string
          - name: contactLabel
            label: Contact heading
            type: string
          - name: mapTitle
            label: Map title. Supports {address}.
            type: string
  - name: services
    label: Services and prices
    type: file
    path: src/content/services.json
    fields:
      - name: eyebrow
        label: Eyebrow
        type: string
      - name: headline
        label: Headline
        type: string
      - name: ui
        label: Service interface text
        type: object
        fields:
          - name: serviceCountLabel
            label: Category service count label. Supports {count}.
            type: string
          - name: panelKicker
            label: Price panel heading
            type: string
          - name: orderLabel
            label: Order service button
            type: string
          - name: orderAriaLabel
            label: Order button accessibility label. Supports {service}.
            type: string
          - name: priceNote
            label: Price note
            type: text
      - name: categories
        label: Categories
        type: object
        list: true
        fields:
          - name: id
            label: ID
            type: string
          - name: title
            label: Category
            type: string
          - name: services
            label: Services
            type: object
            list: true
            fields:
              - name: name
                label: Service
                type: string
              - name: price
                label: Price
                type: string
  - name: schedule
    label: Opening hours
    type: file
    path: src/content/opening-hours.json
    fields:
      - name: closedLabel
        label: Closed days status
        type: string
      - name: daysOfWeek
        label: Weekday names
        type: object
        list: true
        fields:
          - name: weekday
            label: Weekday index (Sunday is 0)
            type: number
          - name: full
            label: Full weekday name
            type: string
      - name: groups
        label: Schedule groups
        type: object
        list: true
        fields:
          - name: label
            label: Days label
            type: string
          - name: days
            label: Weekday indexes (Sunday is 0)
            type: number
            list: true
          - name: open
            label: Opens at
            type: string
          - name: close
            label: Closes at
            type: string
